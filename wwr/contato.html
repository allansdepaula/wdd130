    <main>
        <div>
            <h1>RIO ABAIXO</h1>
            <address>Estrada Socorro Munhoz Km-5 (Corredor Turístico do Rio do Peixe) - Socorro - SP</address>
        </div>
        <div class="contato">
            <iframe src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d3683.100915773785!2d-46.48033688971924!3d-22.612706427340402!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1sEstrada%20Socorro%20Munhoz%20Km-5%20(Corredor%20Tur%C3%ADstico%20do%20Rio%20do%20Peixe)%20-%20Socorro%20-%20SP!5e0!3m2!1spt-BR!2sbr!4v1795713644059!5m2!1spt-BR!2sbr" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <form>
            <div class="coluna1">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
            </div>
            <div class="coluna2">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
            </div>
            <div class="coluna3">     
                <label>Propósito da Mensagem:</label>
                <label for="duvida"><input type="radio" id="duvida" name="proposito" value="duvida">Dúvida Geral</label>
                <label for="reserva"><input type="radio" id="reserva" name="proposito" value="reserva">Pergunta sobre Reserva</label>
                <label for="sugestao"><input type="radio" id="sugestao" name="proposito" value="sugestao">Sugestão</label>
            </div>
            <div class="coluna4">
                <label for="mensagem">Mensagem<textarea name="mensagem" id="mensagem"></textarea></label>
            </div>
            <div class="coluna5">
                <label for="newsletter"><input type="checkbox" id="newsletter" name="newsletter">Por favor, me inscreva na newsletter mensal.</label>
            </div>
            <div class="coluna6">
                <button type="submit"> Entrar em Contato!</button>
            </div>
        </form>
        </div>
           <section>
            <h2>Estamos Aqui para Serví-lo</h2>
            <div class="galeria">
                <figure>
                    <img src="imagens/bruno.webp" alt="Coordenador de Operações">
                    <figcaption>Bruno - Coordenador de Operações</figcaption>
                </figure>
                <figure>
                    <img src="imagens/camila.webp" alt="Guia de Turismo de Aventura">
                    <figcaption>Camila - Guia de Turismo de Aventura</figcaption>
                </figure>
                <figure>
                    <img src="imagens/rafael.webp" alt="Instrutor de Rafting">
                    <figcaption>Rafael - Instrutor de Rafting</figcaption>
                </figure>
            </div>
        </section>
